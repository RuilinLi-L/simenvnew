# 2-D SLAM parameters for the indoor A1 competition scene.
# The map is intentionally named nav_map so it never conflicts with any
# Gazebo/referee transform named map or odom.

map_frame: nav_map
base_frame: base
odom_frame: base
use_tf_scan_transformation: true
use_tf_pose_start_estimate: false
# The simulator already has unrelated referee TF publishers. Navigation only
# consumes Hector's pose topic, so do not publish a competing nav_map -> base TF.
pub_map_odom_transform: false
pub_map_scanmatch_transform: false

map_resolution: 0.05
map_size: 1024
map_start_x: 0.5
map_start_y: 0.5
map_multi_res_levels: 2

update_factor_free: 0.40
update_factor_occupied: 0.90
map_update_distance_thresh: 0.20
map_update_angle_thresh: 0.10
laser_z_min_value: -0.20
laser_z_max_value: 0.80
laser_min_dist: 0.15
laser_max_dist: 8.00
map_pub_period: 0.5
advertise_map_service: true
scan_subscriber_queue_size: 5
